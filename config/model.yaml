# Model facts for the model-agnostic click-run driver.
# Everything the shell scripts, the preflight memory arithmetic and the server
# need to know about THIS model lives here; adding another model is a data-only
# change (see docs/PROTOCOL.md, "Adopting the protocol").
# Subset-YAML only (scripts/miniyaml.py): block maps, block lists, flow lists.
schema: 1

model:
  # name reported by GET /v1/models and accepted in the "model" request field
  served_name: minicpm-v-4.7-35b-a3b-exl3-6.08bpw
  family: MiniCPM-V-4.7-35B-A3B
  base_model: openbmb/MiniCPM-V-4.7-35B-A3B
  base_revision: 4c7623a9326e0f74313bbc7292d852a9e3018a70
  license: apache-2.0
  # config.json "architectures[0]" the engine must recognise
  arch: MiniCPMV4_7ForConditionalGeneration
  vocab_size: 248144
  max_position_embeddings: 262144
  # modalities this runtime serves (the checkpoint itself also does image/video)
  modalities_served: [text]
  modalities_model: [text, image, video]
  # memory arithmetic inputs (docs/MEMORY.md derives each number)
  kv_bytes_per_token: 20480        # fp16 K+V, 10 full-attention layers x 2 x 2 KV heads x 256 x 2 B
  recurrent_state_bytes: 64389120  # gated-delta-net state per sequence slot, independent of context
  full_attention_layers: 10
  weights_bytes: 28296977900
  weights_gib: 26.35
  # chat template facts (chat_template.jinja ships inside the pack)
  chat_template: chat_template.jinja
  thinking_default: true
  thinking_kwarg: enable_thinking
  thinking_kwarg_aliases: [thinking]
  think_open: "<think>\n"
  think_end: "</think>"
  tool_call_format: qwen_xml
  # generation defaults (the pack's generation_config.json)
  sampling_defaults:
    temperature: 1.0
    top_k: 20
    top_p: 0.95
  # tokens that end a turn: <|im_end|>, <|endoftext|>
  stop_token_ids: [248046, 248044]
  stop_strings: ["<|im_end|>"]
  # ids >= vocab_size are padding columns of the output head and must never be sampled
  max_generated_id: 248143

